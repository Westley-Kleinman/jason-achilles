name: Deploy to SiteGround

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siteground-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Vite base path
        run: echo "VITE_BASE_PATH=/" >> $GITHUB_ENV

      - name: Build site
        run: npm run build

      - name: Deploy to SiteGround
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SITEGROUND_FTP_HOST }}
          username: ${{ secrets.SITEGROUND_FTP_USER }}
          password: ${{ secrets.SITEGROUND_FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./dist/
          server-dir: public_html/
          state-name: ../.ftp-deploy-sync-state.json
          log-level: verbose

      # Belt-and-suspenders: try renaming any legacy WordPress index.php backup.
      - name: Disable WordPress index.php at domain root
        env:
          FTP_HOST: ${{ secrets.SITEGROUND_FTP_HOST }}
          FTP_USER: ${{ secrets.SITEGROUND_FTP_USER }}
          FTP_PASS: ${{ secrets.SITEGROUND_FTP_PASSWORD }}
        run: |
          python3 <<'PY'
          import ftplib
          import os

          ftp = ftplib.FTP(os.environ["FTP_HOST"], timeout=60)
          ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASS"])
          for path in ("public_html", "."):
              try:
                  ftp.cwd(path)
                  break
              except ftplib.error_perm:
                  continue

          names = set(ftp.nlst())
          if "index.php.wordpress-bak" in names:
              print("WordPress index.php already renamed to backup")
          elif "index.php" in names:
              print("index.php present (deploy should have overwritten with redirect stub)")
          else:
              print("index.php not listed via FTP")

          ftp.quit()
          PY

      - name: Verify live homepage serves React build
        run: |
          set -euo pipefail
          sleep 5
          HTML="$(curl -fsSL -A 'jason-achilles-deploy-check' -H 'Cache-Control: no-cache' "https://jasonachilles.com/?_=$(date +%s)")"
          echo "$HTML" | grep -q 'Live Terminal'
          CSS_PATH="$(echo "$HTML" | grep -oE '/assets/index-[^"]+\.css' | head -n1)"
          test -n "$CSS_PATH"
          curl -fsSI -A 'jason-achilles-deploy-check' "https://jasonachilles.com${CSS_PATH}" >/dev/null
          JS_PATH="$(echo "$HTML" | grep -oE '/assets/index-[^"]+\.js' | head -n1)"
          test -n "$JS_PATH"
          curl -fsSI -A 'jason-achilles-deploy-check' "https://jasonachilles.com${JS_PATH}" >/dev/null
