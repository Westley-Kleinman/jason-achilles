name: Deploy to SiteGround

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siteground-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Vite base path
        run: echo "VITE_BASE_PATH=/" >> $GITHUB_ENV

      - name: Build site
        run: npm run build

      - name: Deploy to SiteGround
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SITEGROUND_FTP_HOST }}
          username: ${{ secrets.SITEGROUND_FTP_USER }}
          password: ${{ secrets.SITEGROUND_FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./dist/
          server-dir: public_html/
          state-name: ../.ftp-deploy-sync-state.json
          log-level: verbose

      # SiteGround nginx prefers index.php before Apache reads DirectoryIndex.
      # Renaming the legacy WordPress bootstrap is the reliable fix on shared hosting.
      - name: Disable WordPress index.php at domain root
        env:
          FTP_HOST: ${{ secrets.SITEGROUND_FTP_HOST }}
          FTP_USER: ${{ secrets.SITEGROUND_FTP_USER }}
          FTP_PASS: ${{ secrets.SITEGROUND_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get install -y lftp
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" <<'EOF'
          set ftp:ssl-allow no
          set cmd:fail-exit no
          cd public_html
          mv -n index.php index.php.wordpress-bak
          bye
          EOF
          echo "WordPress index.php renamed (or already absent)."

      - name: Verify live homepage serves React build
        run: |
          set -euo pipefail
          HTML="$(curl -fsSL -A 'jason-achilles-deploy-check' https://jasonachilles.com/)"
          echo "$HTML" | grep -q 'Live Terminal'
          CSS_PATH="$(echo "$HTML" | grep -oE '/assets/index-[^"]+\.css' | head -n1)"
          test -n "$CSS_PATH"
          curl -fsSI -A 'jason-achilles-deploy-check' "https://jasonachilles.com${CSS_PATH}" >/dev/null
          JS_PATH="$(echo "$HTML" | grep -oE '/assets/index-[^"]+\.js' | head -n1)"
          test -n "$JS_PATH"
          curl -fsSI -A 'jason-achilles-deploy-check' "https://jasonachilles.com${JS_PATH}" >/dev/null
